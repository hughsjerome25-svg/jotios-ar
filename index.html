<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060a" />
  <title>JOTIOS WRLD — AR Experience</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05060a; font-family: Arial, Helvetica, sans-serif; }
    #loading { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 24px; background: #05060a; text-align: center; }
    #loading .box { max-width: 420px; }
    #loading img { width: min(58vw, 230px); max-height: 42vh; object-fit: contain; border-radius: 16px; }
    #loading h1 { margin: 18px 0 8px; letter-spacing: .08em; font-size: 1.2rem; }
    #loading p { margin: 0; opacity: .72; line-height: 1.4; font-size: .94rem; }
    #ui { position: fixed; inset: 0; z-index: 20; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: max(18px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom)); }
    .brand { align-self: center; padding: 8px 12px; border-radius: 999px; background: rgba(0,0,0,.54); backdrop-filter: blur(8px); font-weight: 800; letter-spacing: .11em; font-size: .76rem; }
    .scan-wrap { flex: 1; display: grid; place-items: center; }
    .scan-frame { width: min(72vw, 340px); aspect-ratio: 1272 / 2048; position: relative; opacity: .96; }
    .scan-frame::before, .scan-frame::after, .corner2, .corner3 { content: ""; position: absolute; width: 34px; height: 34px; border-color: white; border-style: solid; filter: drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
    .scan-frame::before { left:0; top:0; border-width:3px 0 0 3px; }
    .scan-frame::after { right:0; top:0; border-width:3px 3px 0 0; }
    .corner2 { left:0; bottom:0; border-width:0 0 3px 3px; }
    .corner3 { right:0; bottom:0; border-width:0 3px 3px 0; }
    #message { align-self: center; max-width: 430px; text-align: center; padding: 11px 15px; border-radius: 14px; background: rgba(0,0,0,.62); backdrop-filter: blur(8px); font-size: .93rem; line-height: 1.35; }
    #soundBtn { pointer-events: auto; margin-top: 10px; border: 0; border-radius: 999px; padding: 11px 16px; font-weight: 800; font-size: .94rem; background: white; color: black; display: none; }
    #error { display:none; position: fixed; inset: 0; z-index: 50; padding: 24px; background:#05060a; place-items:center; text-align:center; }
    #error .panel { max-width: 520px; line-height: 1.5; }
    #error code { word-break: break-word; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="box">
      <img src="assets/jotios-target.png" alt="JOTIOS WRLD target artwork" />
      <h1>JOTIOS WRLD AR</h1>
      <p>Allow camera access, then point your phone at the printed Special Edition artwork.</p>
    </div>
  </div>
  <div id="ui" aria-live="polite">
    <div class="brand">JOTIOS WRLD • SPECIAL EDITION</div>
    <div class="scan-wrap"><div class="scan-frame"><span class="corner2"></span><span class="corner3"></span></div></div>
    <div id="message">Point your camera at the JOTIOS WRLD artwork.<br><button id="soundBtn" type="button">Tap for sound</button></div>
  </div>
  <div id="error"><div class="panel"><h2>AR setup incomplete</h2><p id="errorText"></p></div></div>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 8; warmupTolerance: 5;" embedded color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets timeout="15000">
      <video id="jotiosVideo" src="assets/jotios-video-web.mp4" preload="auto" loop playsinline webkit-playsinline muted crossorigin="anonymous"></video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-video id="videoPlane" src="#jotiosVideo" position="0 0 0.01" width="0.9" height="1.6"></a-video>
    </a-entity>
  </a-scene>
  <script>
    (() => {
      const loading = document.getElementById('loading');
      const message = document.getElementById('message');
      const soundBtn = document.getElementById('soundBtn');
      const target = document.getElementById('target');
      const video = document.getElementById('jotiosVideo');
      const error = document.getElementById('error');
      const errorText = document.getElementById('errorText');
      let found = false;
      async function hasTargetFile() {
        try { const r = await fetch('./targets.mind', { method: 'HEAD', cache: 'no-store' }); return r.ok; }
        catch { return true; }
      }
      window.addEventListener('load', async () => {
        const ok = await hasTargetFile();
        if (!ok) {
          loading.style.display = 'none';
          error.style.display = 'grid';
          errorText.innerHTML = 'The tracking file <code>targets.mind</code> is missing.';
          return;
        }
        setTimeout(() => { loading.style.display = 'none'; }, 1500);
      });
      target.addEventListener('targetFound', async () => {
        found = true;
        message.firstChild.textContent = 'Artwork detected — your video is playing.';
        try { video.muted = false; await video.play(); soundBtn.style.display = 'none'; }
        catch { video.muted = true; try { await video.play(); } catch {} soundBtn.style.display = 'inline-block'; }
      });
      target.addEventListener('targetLost', () => {
        found = false;
        video.pause();
        message.firstChild.textContent = 'Point your camera at the JOTIOS WRLD artwork.';
      });
      soundBtn.addEventListener('click', async () => {
        try { video.muted = false; await video.play(); soundBtn.style.display = 'none'; } catch {}
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) video.pause(); else if (found) video.play().catch(() => {});
      });
    })();
  </script>
</body>
</html>
